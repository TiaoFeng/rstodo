[package]
name = "rstodo-tui"
version = "0.5.3"
edition = "2024"
rust-version = "1.89.0"
repository = "https://github.com/TiaoFeng/rstodo"
description = "A CLI tool for managing to-do lists"
readme = "README.md"
keywords = ["cli", "tui", "tool", "todo"]
license = "MIT"

[[bin]]
name = "rstodo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"]}
serde = { version = "1", features = ["derive"]}
serde_json = { version = "1"}
chrono = { version = "0.4.45" , features = ["serde"]}
comfy-table = "8.0.0"
dirs = "6"
crossterm = "0.29"
# unstable-rendered-line-info: Paragraph::line_count用于详情面板翻页的精确行数测量
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
unicode-segmentation = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
